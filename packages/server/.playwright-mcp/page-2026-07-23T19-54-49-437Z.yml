        - generic [ref=e440]:
          - heading "Биржа фриланса" [level=4] [ref=e441]
          - paragraph [ref=e442]: Вы создаете задание, и оно становится доступно тысячам фрилансеров, которые могут отправить вам предложения. Остается только выбрать лучшее и начать работу. Такой подход к удаленной работе – идеальный вариант для решения больших и уникальных задач.
          - paragraph [ref=e443]: Отличительной чертой биржи Kwork является качество заявок от фрилансеров. Если вы когда-нибудь работали на других фриланс площадках, то знаете, какая это боль получать множество нерелевантных предложений от исполнителей, которые даже не прочитали текст вашего задания. Но на Kwork всё по-другому – благодаря особому функционалу любому фрилансеру приходится ценить каждую отправленную заявку. Поэтому подавляющее большинство полученных предложений поступают от исполнителей, внимательно ознакомившихся с сутью задачи и сразу предлагающих то или иное решение.
          - paragraph [ref=e444]: И еще один важный момент, на бирже фриланса и в магазине Kwork безопасная оплата заказов, которая проходит через систему - исполнитель получает деньги, только когда вы одобрите результат. В случае просрочки денежные средства можно вернуть на свой счет в один клик.
